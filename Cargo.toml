[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/BitBraid/bitbraid"
authors = ["BitBraid contributors"]
publish = false

[workspace.dependencies]
# internal
bitbraid-core = { path = "crates/core" }
bitbraid-git = { path = "crates/git" }
bitbraid-engine = { path = "crates/engine" }
bitbraid-integrations = { path = "crates/integrations" }
bitbraid-ui = { path = "crates/ui" }
bitbraid-testkit = { path = "crates/testkit" }
bitbraid-terminal = { path = "crates/terminal" }
bitbraid-strings = { path = "crates/strings" }

# external (versions are resolved once here; crates reference these entries)
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Changes one key in keybindings.toml and keeps the comments and layout of the user's file.
toml_edit = "0.25"
clap = { version = "4", features = ["derive"] }
cargo_metadata = "0.23"
gpui-kit = { version = "0.7", features = ["tree-sitter-rust", "tree-sitter-go", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-python", "tree-sitter-yaml", "tree-sitter-toml", "tree-sitter-markdown", "tree-sitter-html", "tree-sitter-css", "tree-sitter-bash", "tree-sitter-c", "tree-sitter-cpp", "tree-sitter-java"] }
futures = "0.3"
base64 = "0.22"
directories = "6"
# HTTPS: TLS with the system's roots, the reading of a response's head,
# the hash a picture is asked for by, and the decoder the toolkit already
# brings.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
httparse = "1"
sha2 = "0.11"
image = { version = "0.25", default-features = false }
# The updater: a package's minisign signature checked (Ed25519 over its
# BLAKE2b-512, no dependencies of its own), and which of two versions is
# the newer.
minisign-verify = "0.3"
semver = "1"
# The terminal: the parser, the grid and the PTY, without its own
# configuration files.
alacritty_terminal = { version = "0.26", default-features = false }
# Signals to a terminal's shell and its group, and its exit read without
# reaping it, with no `unsafe` of our own (the version the PTY code uses).
rustix = { version = "1", default-features = false, features = ["std", "process"] }

# Never-crash policy (AGENTS.md, section 4). Crates opt in with `[lints] workspace = true`.
# Tests may relax these with `#![cfg_attr(test, allow(clippy::unwrap_used, ...))]`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

# Builds and tests (the test profile inherits this one). Our crates keep
# the file and line of every frame, which is what a backtrace and a
# debugger's stack need; the dependencies keep none. Full debug info would
# make a test program 250 MB to 1.5 GB and a build directory five times as
# large.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# What is shipped (`cargo build --profile dist -p bitbraid`): the release
# profile with the whole program optimised as one unit, which takes several
# times as long to build and is why tests and benchmarks do not use it.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# Code that runs once in a while and is large is built for size, in every
# optimised profile: the D-Bus client, the shader translator (it runs when
# the window is made), image decoders, the SVG reader, accessibility.
# Nothing on the path of a frame or of a walk through history.
[profile.release.package]
zvariant = { opt-level = "s" }
zbus = { opt-level = "s" }
zbus_names = { opt-level = "s" }
naga = { opt-level = "s" }
image = { opt-level = "s" }
exr = { opt-level = "s" }
image-webp = { opt-level = "s" }
zune-jpeg = { opt-level = "s" }
tiff = { opt-level = "s" }
gif = { opt-level = "s" }
usvg = { opt-level = "s" }
markdown = { opt-level = "s" }
oo7 = { opt-level = "s" }
ashpd = { opt-level = "s" }
accesskit = { opt-level = "s" }
accesskit_unix = { opt-level = "s" }
accesskit_consumer = { opt-level = "s" }
atspi = { opt-level = "s" }
x11rb = { opt-level = "s" }
x11rb-protocol = { opt-level = "s" }
regex-syntax = { opt-level = "s" }
# TLS, for the pictures of authors a user may switch on: a
# handshake now and then, on threads that wait for the network anyway.
rustls = { opt-level = "s" }
rustls-webpki = { opt-level = "s" }
ring = { opt-level = "s" }
# The providers' clients, on threads that wait for the network, and the
# reading and writing of configuration files of a few KiB: 1.4 MB less.
# libgit2 stays as it is: it would give 0.3 MB, and a person waits for its
# index writes.
bitbraid-integrations = { opt-level = "s" }
toml = { opt-level = "s" }
toml_edit = { opt-level = "s" }
toml_parser = { opt-level = "s" }
toml_datetime = { opt-level = "s" }
toml_writer = { opt-level = "s" }
toml_write = { opt-level = "s" }
