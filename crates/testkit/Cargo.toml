[package]
name = "bitbraid-testkit"
description = "Test support: fixture repositories, the git oracle, stand-in servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[package.metadata.bitbraid]
layer = 0

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
# Servers for the transport tests: Basic logins and PEM text, and TLS with
# certificates from an authority of the test's own, in the versions and with
# the features the integrations crate already brings.
base64 = { workspace = true }
rustls = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
# Packages signed as minisign signs them, with a key of the tests' own, for
# the updater: Ed25519 from the `ring` the TLS stack brings, over
# BLAKE2b-512.
ring = "0.17"
blake2 = "0.11"

# The temporary folder in its long form, without `\\?\` (`scratch_root`).
[target.'cfg(windows)'.dependencies]
dunce = "1"
